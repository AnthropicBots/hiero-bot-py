version: '3.8'

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://hiero:hieropass@db:5432/hiero_db
      - ENVIRONMENT=development
      - LOG_LEVEL=info
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: hiero
      POSTGRES_PASSWORD: hieropass
      POSTGRES_DB: hiero_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiero -d hiero_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
